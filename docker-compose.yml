services:
  mysql:
    image: mysql:8.4
    container_name: loan-dss-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loan_dss}
      MYSQL_USER: ${MYSQL_USER:-loan_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-loan_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loan-dss-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-loan_dss}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-loan_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-loan_password}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-bG9hbi1kc3MtZGV2LXNlY3JldC1rZXktdGhpcnR5LXR3by1ieXRlcw==}
      # Bootstrap: enabled for dev, override to false in production
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-true}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@gmail.com}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-123456}
      APP_BOOTSTRAP_DEMO_ENABLED: ${APP_BOOTSTRAP_DEMO_ENABLED:-true}
      APP_BOOTSTRAP_DEMO_PASSWORD: ${APP_BOOTSTRAP_DEMO_PASSWORD:-123456}
      APP_AUTH_EMAIL_VERIFICATION_ENABLED: ${APP_AUTH_EMAIL_VERIFICATION_ENABLED:-false}
      APP_AUTH_EMAIL_VERIFICATION_FRONTEND_URL: ${APP_AUTH_EMAIL_VERIFICATION_FRONTEND_URL:-http://localhost:5173/verify-email}
      APP_AUTH_EMAIL_VERIFICATION_FROM: ${APP_AUTH_EMAIL_VERIFICATION_FROM:-}
      APP_MAIL_HOST: ${APP_MAIL_HOST:-smtp.gmail.com}
      APP_MAIL_PORT: ${APP_MAIL_PORT:-587}
      APP_MAIL_USERNAME: ${APP_MAIL_USERNAME:-}
      APP_MAIL_PASSWORD: ${APP_MAIL_PASSWORD:-}
      # Demo time resolver: enabled for dev, MUST be false in production
      APP_DEMO_ENABLED: ${APP_DEMO_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_profile_documents:/app/storage/profile-documents
      - backend_loan_documents:/app/storage/loan-documents
      - backend_payment_proofs:/app/storage/payment-proofs
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loan-dss-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
      VITE_PAYMENT_BANK_NAME: ${VITE_PAYMENT_BANK_NAME:-Techcombank}
      VITE_PAYMENT_BANK_ID: ${VITE_PAYMENT_BANK_ID:-TCB}
      VITE_PAYMENT_ACCOUNT_NO: ${VITE_PAYMENT_ACCOUNT_NO:-19071533252015}
      VITE_PAYMENT_ACCOUNT_NAME: ${VITE_PAYMENT_ACCOUNT_NAME:-NGUYEN MINH HUNG}
      VITE_PAYMENT_QR_TEMPLATE: ${VITE_PAYMENT_QR_TEMPLATE:-compact2}
      VITE_PAYMENT_TRANSFER_PREFIX: ${VITE_PAYMENT_TRANSFER_PREFIX:-THANHTOAN}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_profile_documents:
  backend_loan_documents:
  backend_payment_proofs:
